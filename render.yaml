services:
  - type: web
    name: freqtrade-sfeef-bot
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm run start
    disk:
      name: trading-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: PERSIST_DIR
        value: /data
      - key: BINANCE_API_KEY
        sync: false
      - key: BINANCE_SECRET_KEY
        sync: false
      - key: APP_API_TOKEN
        sync: false
      - key: VITE_API_TOKEN
        sync: false
